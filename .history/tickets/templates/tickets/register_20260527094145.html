{% extends 'tickets/base.html' %}

{% block title %} Registro {% endblock %}

{% block body %}

<h1>Crear Cuenta</h1>
<div class="register-container">

    <h2 class="h3">Registro</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Usuario</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            {{ form.password1 }}
        </div>

        <div class="form-group">
            <label>Confirmar contraseña</label>
            {{ form.password2 }}
        </div>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p class="pcartelera">
        ¿Ya tienes cuenta?
        <a href="{% url 'login' %}">
            Iniciar sesión
        </a>
    </p>

    
</div>

{% endblock %}
