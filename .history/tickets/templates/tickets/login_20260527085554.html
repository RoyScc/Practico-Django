{% extends 'tickets/base.html' %}

{% block body %}

<h2>Login</h2>

<form method="POST">
    <div class="form-group">
        <label>Usuario</label>
        {{ form.username }}
    </div>
    <div class="form-group">
        <label>Contraseña</label>
        {{ form.password }}
    </div>
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Ingresar</button>
</form>

<p>
    ¿No tienes cuenta?
    <a href="{% url 'register' %}">Registrarse</a>
</p>

{% endblock %}
